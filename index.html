<!DOCTYPE html>
<html>

<head>

<title>3D Racing Game</title>

<style>

body{

margin:0;
overflow:hidden;
background:black;

}

canvas{

display:block;

}
#controls{

position:fixed;

bottom:20px;

width:100%;

text-align:center;

}

#controls button{

font-size:30px;

padding:15px 25px;

margin:5px;

border-radius:15px;

border:none;

}
#ui{

position:fixed;

top:20px;

left:20px;

color:white;

font-size:20px;

font-family:Arial;

}

#ui button{

padding:10px 20px;

font-size:18px;

border-radius:10px;

}
</style>

</head>


<body>
<div id="ui">

<button onclick="startGame()">START</button>

<p>Speed: <span id="speed">0</span></p>

<p>Time: <span id="time">0</span></p>

<p>Score: <span id="score">0</span></p>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<div id="controls">

<button onclick="moveLeft()">⬅️</button>

<button onclick="speedUp()">⬆️</button>

<button onclick="moveRight()">➡️</button>

</div>
<script src="script.js"></script>


</body>

</html>
