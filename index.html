<!DOCTYPE html>
<html>

<head>

<title>3D Racing Game</title>

<style>

body{

margin:0;
overflow:hidden;
background:black;

}

canvas{

display:block;

}
#controls{

position:fixed;

bottom:20px;

width:100%;

text-align:center;

}

#controls button{

font-size:30px;

padding:15px 25px;

margin:5px;

border-radius:15px;

border:none;

}
</style>

</head>


<body>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<div id="controls">

<button onclick="moveLeft()">⬅️</button>

<button onclick="speedUp()">⬆️</button>

<button onclick="moveRight()">➡️</button>

</div>
<script src="script.js"></script>


</body>

</html>
